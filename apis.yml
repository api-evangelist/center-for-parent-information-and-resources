  - aid: center-for-parent-information-and-resources:cpir-site-metadata-api
    name: CPIR Site Metadata API
    description: >-
      The anonymously readable metadata layer of the parentcenterhub.org WordPress REST API - the discovery
      root enumerating 34 namespaces and 717 routes with their argument schemas, the registered content
      types, taxonomies and publication statuses, and the Yoast SEO head document carrying schema.org
      JSON-LD for any CPIR URL. Note that the WordPress content collections on this host (posts, pages,
      media, categories, tags, users, search) are NOT public: every one returns 401 rest_forbidden to
      an anonymous caller, verified 2026-09-05. Article content is available through the site RSS feed
      instead.
    humanURL: https://www.parentcenterhub.org/
