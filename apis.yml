  - aid: center-for-parent-information-and-resources:cpir-oembed-api
    name: CPIR oEmbed API
    description: >-
      Public, unauthenticated oEmbed 1.0 provider endpoint for parentcenterhub.org. Given the URL of any
      CPIR page it returns a conformant oEmbed document naming the provider, title, author and embeddable
      HTML - the standards-based way for another site or an agent to cite or embed CPIR content. Verified
      live on 2026-09-05 returning provider_name 'Center for Parent Information and Resources'.
    humanURL: https://www.parentcenterhub.org/the-cpir-resource-center/
