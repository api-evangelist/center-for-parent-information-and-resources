description: >-
  The Center for Parent Information and Resources (CPIR) is the federally funded central hub of information
  and products for the national network of Parent Training and Information Centers (PTIs) and Community
  Parent Resource Centers (CPRCs). An OSEP-funded project operated by the SPAN Parent Advocacy Network,
  CPIR supports families and youth with a focus on children with disabilities, delivering resources through
  the Parent Center Hub website, the Buzz from the Hub newsletter, webinars, glossaries and an events
  calendar. CPIR runs no developer program and publishes no API documentation, but its own host serves
  a real anonymous read-only JSON API: the WordPress REST API at parentcenterhub.org/wp-json exposed 34
  namespaces and 717 routes on 2026-09-05, including the Connections directory namespace cn-api/v1 that
  carries the national Parent Center directory (784+ geocoded centers across 55 state and territory terms),
  plus ISO 3166-1 country reference data, US state geography and GeoJSON, an oEmbed 1.0 provider endpoint,
  and schema.org structured data. The WordPress content collections (posts, pages, media, users, search)
  are closed to anonymous callers and return 401 rest_forbidden; article content is available through
  the site RSS feed.
