  - aid: center-for-parent-information-and-resources:cpir-geography-reference-api
    name: CPIR Geography Reference API
    description: >-
      Public, unauthenticated reference data served alongside the Parent Center directory: ISO 3166-1
      country records with alpha-2 and alpha-3 codes, ISO 4217 currency and calling codes; administrative
      subdivisions with centroids and bounding boxes (US states and territories); and country boundary
      geometry as GeoJSON (RFC 7946). This is the geography layer the Find Your Parent Center map is built
      on. Verified live on 2026-09-05.
    humanURL: https://www.parentcenterhub.org/find-your-center/
    baseURL: https://www.parentcenterhub.org/wp-json
