  detail: >-
    The Kin Score `education` regulatory regime shortlist was checked against the contract on
    2026-09-05 and none of those standards appear. That is the correct result rather than a gap:
    CPIR is a federally funded information and referral hub, not a student-records, courseware,
    identity-federation or scholarly-repository system, so the standards that regime shortlists have
    no surface here to attach to. The domain standard this contract DOES declare is vCard/hCard, the
    contact-directory vocabulary, recorded above.
compliance_programs:
  published: false
  detail: >-
    No trust center, SOC 2, ISO 27001, FedRAMP or other certification page was found; the
    probe-security-programs pass returned vdp=none trust=none on 2026-09-05. As a federally funded
